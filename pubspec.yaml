name: BillingueApp
description: Apprends le Baoulé, langue locale de Côte d'Ivoire
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  geolocator: ^14.0.2
  google_maps_flutter: ^2.17.0
  flutter_riverpod: ^3.3.1
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Utilise les polices système (Nunito peut être ajouté manuellement)
