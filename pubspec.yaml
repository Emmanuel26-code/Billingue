name: BillingueApp
description: Apprends le Baoulé, langue locale de Côte d'Ivoire
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  firebase_core: ^4.9.0
  firebase_auth: ^6.7.1
  cloud_firestore: ^6.10.2
  google_sign_in: ^6.2.1
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  geolocator: ^14.0.2
  google_maps_flutter: ^2.17.0
  flutter_riverpod: ^3.3.1
  http: ^1.2.0
  flutter_tts: ^4.0.2
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.0
  speech_to_text: ^7.4.0
  audioplayers: ^6.0.0
  record: ^5.1.2
  path_provider: ^2.1.4
  http_parser: ^4.0.2
  cloud_functions: ^6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  record_linux: 1.2.0 
  record_platform_interface: 1.4.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/avatars/
    - assets/sound/baoule/

  # Utilise les polices système (Nunito peut être ajouté manuellement)
