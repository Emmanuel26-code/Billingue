name: BillingueApp
description: Apprends le Baoulé, langue locale de Côte d'Ivoire
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  geolocator: ^14.0.2
  google_maps_flutter: ^2.17.0
  flutter_riverpod: ^3.3.1
  http: ^1.2.0
  flutter_tts: ^4.0.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  speech_to_text: ^6.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/avatars/

  # Utilise les polices système (Nunito peut être ajouté manuellement)
